    <div class="container">
      <div class="card">
        <div class="card-header">
          <h1>🕒 History</h1>
          <p>View your quiz attempt history and performance</p>
        </div>
        <div class="card-content">
            <div class="filters">
                <div class="search-container">   <!-- Kính lúp -->
                    <input type="text" placeholder="Search by topic" class="search-input">
                    <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                </div>
            <div class="select-container">
              <select class="difficulty-select" id="history-difficulty">
                <option value="All" selected>All Difficulty</option>
                <option value="Easy">Easy</option>
                <option value="Medium">Medium</option>
                <option value="Difficult">Difficult</option>
              </select>
            </div>
          </div>
          <div class="table-container">
            <table class="history-table">
              <thead>
                <tr>
                  <th>Test Date</th>
                  <th>Quiz Topic</th>
                  <th>Difficulty</th>
                  <th>Score</th>
                  <th>Status</th>
                  <th>Actions</th>
                  <th>Delete Quiz</th>
                </tr>
              </thead>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Quiz Generator</title>
    <link rel="stylesheet" href="homepage.css">
</head>
<body>
    <div class="matrix-bg"></div> <!-- Nền hiệu ứng Matrix -->
    <a href="#" class="history-btn">🕒 History</a>

    
    <div class="container">
        <h1>A.I.</h1>
        <p>Type a subject to generate a quiz</p>

        <input type="text" placeholder="Enter a subject...">
    
        <div class="options">
            <select>
                <option>Language</option>
                <option>English</option>
                <option>Vietnamese</option>
            </select>

            <select>
                <option>Difficulty Level</option>
                <option>Easy</option>
                <option>Medium</option>
                <option>Difficult</option>
            </select>
            <select>
                <option>10 Question</option>
                <option>8 Question</option>
                <option>4 Question</option>
                <option>12 Question</option>
            </select>
        </div>
        <!-- <button class="generate-btn">⚡ Generate AI Quiz</button> -->
        <div class="button-group">
            <button class="preview-btn" onclick="window.location.href='preview.html'">👁️ Preview</button>
            <button class="generate-btn">⚡ Generate AI Quiz</button>
        </div>
    </div>
</body>
</html>

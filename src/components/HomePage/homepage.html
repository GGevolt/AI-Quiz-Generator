<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Quiz Generator</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="matrix-bg"></div>

  <!-- HISTORY BUTTON -->
  <a href="src/components/History/History.html" class="history-btn">🕒 History</a>

  <!-- QUIZZ -->
  <div class="container">
    <h1>A.I.</h1>
    <p>Type a subject to generate a quiz</p>

    <input type="text" placeholder="Enter a subject..." id="theme-input" />
    <div class="options">
      <select id="language-select">
        <option selected>English</option>
        <option>Vietnamese</option>
        <option>Spanish</option>
        <option>French</option>
        <option>German</option>
        <option>Chinese</option>
        <option>Japanese</option>
        <option>Korean</option>
        <option>Russian</option>
        <option>Italian</option>
        <option>Portuguese</option>
        <option>Hindi</option>
        <option>Arabic</option>
      </select>

      <select id="difficulty-select">
        <option selected>Easy</option>
        <option>Medium</option>
        <option>Difficult</option>
      </select>

      <input
        id="questions-count"
        type="number"
        value="10"
        min="1"
        max="10"
        step="1"
        onfocus="this.value=10;"
        onkeydown="return false;"
      />
      <span class="label">Questions</span>
    </div>

    <button class="generate" id="gen-btn">⚡ Generate AI Quiz</button>

    <div class="container-preview" id="questions-preview"></div>
  </div>

  <!-- LOADER -->
  <div id="loader" class="">
    <div class="loader--background">
      <span class="loader"></span>
    </div>
  </div>

  <script>
    // Add this to your existing JavaScript
    document.getElementById('gen-btn').addEventListener('click', function() {
      // Your existing code for generating the quiz
      
      // Add this line to apply the quiz-active class to the container
      document.querySelector('.container').classList.add('quiz-active');
    });
  </script>
</body>
</html>
